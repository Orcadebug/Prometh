[project]
name = "prometh-skill-websearch"
version = "0.1.0"
description = "Web search skill for Prometh (Google search via Serper API)."
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1", "prometh-runtime"]

[project.scripts]
websearch = "rlm.skill:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/websearch"]
