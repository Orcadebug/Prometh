[project]
name = "prometh-skill-linear"
version = "0.1.0"
description = "Linear integration skill for Prometh (Linear's official MCP server)."
requires-python = ">=3.10"
dependencies = ["mcp", "httpx", "prometh-runtime"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear"]
